name: Rename project to YNFC

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rename-ynfc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Rename package, project and source paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          replacements = {
              'com.yagay.nfcdoorcard': 'com.yagay.YNFC',
              'NFC门禁卡X': 'YNFC',
              'NFC Expert Pro': 'YNFC',
              'NfcDoorCard': 'YNFC',
          }

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if len(path.parts) >= 2 and path.parts[0] == '.github' and path.parts[1] == 'workflows':
                  continue
              try:
                  raw = path.read_bytes()
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')

          moves = [
              (Path('app/src/main/java/com/yagay/nfcdoorcard'), Path('app/src/main/java/com/yagay/YNFC')),
              (Path('app/src/test/java/com/yagay/nfcdoorcard'), Path('app/src/test/java/com/yagay/YNFC')),
          ]
          for src, dst in moves:
              if src.exists():
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  if dst.exists():
                      shutil.rmtree(dst)
                  shutil.move(str(src), str(dst))
          PY

      - name: Validate rename completeness
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'com\.yagay\.nfcdoorcard|NFC门禁卡X|NFC Expert Pro|NfcDoorCard' -- . ':(exclude).github/workflows/**'; then
            echo 'Old project/package references remain outside workflows.' >&2
            exit 1
          fi
          test -d app/src/main/java/com/yagay/YNFC
          test -d app/src/test/java/com/yagay/YNFC
          test ! -e app/src/main/java/com/yagay/nfcdoorcard
          test ! -e app/src/test/java/com/yagay/nfcdoorcard
          grep -Fq 'namespace = "com.yagay.YNFC"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.yagay.YNFC"' app/build.gradle.kts
          grep -Fq 'com.yagay.YNFC.xposed.NfcInjectionModule' app/src/main/resources/META-INF/xposed/java_init.list
          grep -Fq 'android:authorities="com.yagay.YNFC.config"' app/src/main/AndroidManifest.xml
          grep -Fq '<string name="app_name">YNFC</string>' app/src/main/res/values/strings.xml
          grep -Fq 'name=YNFC' app/src/main/resources/META-INF/xposed/module.prop
          grep -Fq 'rootProject.name = "YNFC"' settings.gradle.kts
          grep -Fq 'com.android.nfc' app/src/main/resources/META-INF/xposed/scope.list

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Commit verified YNFC migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git status --short .github/workflows)"
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Workflow files must not be changed by this commit.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Rename NFC project and package to YNFC'
          git push origin HEAD:main
