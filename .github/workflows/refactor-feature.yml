name: Refactor YNFC Feature

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split app and feature
        shell: bash
        run: |
          set -euo pipefail
          if [ -d feature ]; then
            echo "feature already exists"
            exit 0
          fi

          mkdir -p feature/src/main feature/src/test
          git mv app/src/main/java feature/src/main/java
          git mv app/src/main/res feature/src/main/res
          if [ -d app/src/test ]; then git mv app/src/test feature/src/test; fi

          python3 - <<'PY'
          from pathlib import Path
          root = Path('feature/src/main/java')
          old_uri = 'Uri.parse("content://com.yagay.YNFC.config/settings")'
          new_uri = 'Uri.parse("content://" + com.yagay.YNFC.BuildConfig.CONFIG_AUTHORITY + "/settings")'
          for p in root.rglob('*'):
              if p.suffix not in {'.java', '.kt'}:
                  continue
              s = p.read_text()
              n = s.replace(old_uri, new_uri)
              n = n.replace('const val AUTHORITY = "com.yagay.YNFC.config"', 'val AUTHORITY = BuildConfig.CONFIG_AUTHORITY')
              if n != s:
                  p.write_text(n)
          PY

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://api.xposed.info/") }
              }
          }
          rootProject.name = "YNFC"
          include(":app", ":feature")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("com.android.library") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.yagay.YNFC.standalone"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.yagay.YNFC"
                  minSdk = 31
                  targetSdk = 35
                  versionCode = 57
                  versionName = "1.0.56"
                  manifestPlaceholders["ynfcConfigAuthority"] = "com.yagay.YNFC.config"
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      signingConfig = signingConfigs.getByName("debug")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              implementation(project(":feature"))
          }
          EOF

          mkdir -p feature
          cat > feature/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val configAuthority = providers.gradleProperty("ynfcConfigAuthority").orNull
              ?: "com.yagay.YNFC.config"

          android {
              namespace = "com.yagay.YNFC"
              compileSdk = 35

              defaultConfig {
                  minSdk = 31
                  buildConfigField("int", "VERSION_CODE", "57")
                  buildConfigField("String", "VERSION_NAME", "\"1.0.56\"")
                  buildConfigField("int", "HOOK_BUILD", "40")
                  buildConfigField("String", "CONFIG_AUTHORITY", "\"$configAuthority\"")
                  manifestPlaceholders["ynfcConfigAuthority"] = configAuthority
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions { jvmTarget = "17" }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7")
              implementation(platform("androidx.compose:compose-bom:2025.01.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("com.google.code.gson:gson:2.11.0")
              compileOnly("io.github.libxposed:api:102.0.0")
              debugImplementation("androidx.compose.ui:ui-tooling")
              testImplementation("junit:junit:4.13.2")
          }
          EOF

          cat > feature/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.NFC" />
              <uses-feature android:name="android.hardware.nfc" android:required="false" />
              <application>
                  <activity
                      android:name="com.yagay.YNFC.MainActivity"
                      android:exported="false"
                      android:theme="@style/AppTheme" />
                  <provider
                      android:name="com.yagay.YNFC.ConfigProvider"
                      android:authorities="${ynfcConfigAuthority}"
                      android:directBootAware="true"
                      android:exported="true" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.nfc" android:required="true" />
              <application
                  android:allowBackup="false"
                  android:description="@string/module_description"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name="com.yagay.YNFC.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          if grep -R --line-number 'content://com.yagay.YNFC.config/settings' feature/src/main/java; then
            echo "hardcoded YNFC provider authority remains"
            exit 1
          fi
          if grep -R --line-number 'const val AUTHORITY = "com.yagay.YNFC.config"' feature/src/main/java; then
            echo "hardcoded provider constant remains"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split standalone app from reusable feature module"
          git push
